plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.driverspa'
    compileSdk 35

    buildFeatures {
        viewBinding true
        compose true
    }

    defaultConfig {
        applicationId "com.driverspaAdmin"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Ship only the languages the app supports (Kazakh default, Russian, English).
        // Also strips unused locale resources pulled in by libraries.
        resourceConfigurations += ["kk", "ru", "en"]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    // Don't let pre-existing lint findings abort the release (obfuscated) build.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    packaging {
        jniLibs {
            // Wizardroid ships a legacy 32-bit-only .so; exclude it to avoid Play 64-bit rejection.
            excludes += ["**/libwizardroid.so"]
        }
    }
}


dependencies {
    implementation "androidx.core:core:1.12.0"
    // Per-app language API (AppCompatDelegate.setApplicationLocales) — pinned explicitly
    // since LocaleManager depends on it directly (was previously only transitive).
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.gson
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.pretty
    implementation libs.viewpager
    implementation libs.ripplebackground
    implementation libs.drawerlayout

    implementation project(":photoView")
    implementation project(":ProgressWheel")
    implementation project(":pullToRefresh_lib")

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Firebase Cloud Messaging (push notifications). The real
    // app/google-services.json must be downloaded from the Firebase
    // Console (package com.driverspaAdmin) and replace the placeholder
    // committed alongside this file. Until then push tokens won't be
    // delivered to a real Firebase project.
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    implementation 'com.google.android.gms:play-services-maps:18.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.google.maps.android:android-maps-utils:3.5.3'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.3'
    implementation 'org.ocpsoft.prettytime:prettytime:3.2.7.Final'
    implementation 'org.codepond:wizardroid:1.3.1'
    //implementation 'com.google.maps.android:android-maps-utils:2.3.0'
}
